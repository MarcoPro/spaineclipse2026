name: Actualizar Predicción del Tiempo

on:
  schedule:
    # Se ejecuta automáticamente cada 6 horas (a las 00:00, 06:00, 12:00 y 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite ejecutar el flujo manualmente desde la pestaña Actions en GitHub

# Otorgar permisos de escritura para realizar commits y push a la rama principal
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar script de predicción meteorológica por modelos numéricos (20:00 UTC)
        env:
          PYTHONUNBUFFERED: '1'
        run: python -u scripts/generate_weather_forecast_models.py

      - name: Guardar cambios y subir a GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add weather_forecast_data.js
          git diff-index --quiet HEAD || git commit -m "bot: actualización de predicción meteorológica [skip ci]"
          git push
