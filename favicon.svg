<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Corona Glow Filter -->
    <filter id="corona-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="24" result="blur2" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="sharp" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="sharp" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Golden Corona Gradient -->
    <radialGradient id="sun-corona" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#ffffff" />
      <stop offset="72%" stop-color="#ffe100" />
      <stop offset="85%" stop-color="#f39c12" />
      <stop offset="95%" stop-color="#e67e22" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d35400" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Ambient Halo -->
    <radialGradient id="halo-glow" cx="50%" cy="50%" r="50%">
      <stop offset="40%" stop-color="#f1c40f" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#e67e22" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark Cosmic Background Circle -->
  <rect width="512" height="512" rx="110" fill="#090d16" />

  <!-- Outer Ambient Halo -->
  <circle cx="256" cy="256" r="210" fill="url(#halo-glow)" />

  <!-- Solar Rays / Corona Flares -->
  <g stroke="url(#sun-corona)" stroke-linecap="round" opacity="0.85" filter="url(#corona-glow)">
    <line x1="256" y1="36" x2="256" y2="476" stroke-width="6" />
    <line x1="36" y1="256" x2="476" y2="256" stroke-width="6" />
    <line x1="100" y1="100" x2="412" y2="412" stroke-width="5" />
    <line x1="100" y1="412" x2="412" y2="100" stroke-width="5" />
    <line x1="145" y1="65" x2="367" y2="447" stroke-width="3" />
    <line x1="65" y1="145" x2="447" y2="367" stroke-width="3" />
    <line x1="65" y1="367" x2="447" y2="145" stroke-width="3" />
    <line x1="145" y1="447" x2="367" y2="65" stroke-width="3" />
  </g>

  <!-- Glowing Sun Disc Ring -->
  <circle cx="256" cy="256" r="162" fill="url(#sun-corona)" filter="url(#corona-glow)" />

  <!-- Inner Diamond Ring / Baily Bead Accent -->
  <circle cx="375" cy="165" r="14" fill="#ffffff" filter="url(#corona-glow)" />
  <circle cx="375" cy="165" r="6" fill="#fff9c4" />

  <!-- Moon Silhouette (Black Disc Overlay) -->
  <circle cx="256" cy="256" r="146" fill="#090d16" />
</svg>
